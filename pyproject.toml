[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydub_typed"]

[project]
name = "pydub-typed"
version = "0.25.1"
authors = [
    { name = "James Robert", email = "jiaaro@gmail.com" },
    { name = "Ferdinand Keller", email = "ferdinand.keller@proton.me" },
]
description = "Manipulate audio with a simple and easy high level interface. Typed fork of pydub."
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["audioop-lts>=0.2.2", "pyright>=1.1.409"]

[project.optional-dependencies]
scipy = ["scipy>=1.17.1"]
pyaudio = ["pyaudio>=0.2.14"]
simpleaudio = ["simpleaudio>=1.0.4"]

[dependency-groups]
dev = ["ruff>=0.15.12"]

[tool.ruff]
line-length = 120
indent-width = 4
include = ["src/**", "tests/**"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "ALL",  # we want to be as strict as possible
    "W391", # no blank line at end of file (experimental)
]
ignore = [
    "D203",    # 1 blank line required before class docstring
    "D212",    # multi-line docstring summary should start at the first line
    "COM812",  # missing trailing comma in a tuple (redundant with formatter)
    "TC003",   # typing only imports should be in TYPE_CHECKING block
    "PLC0414", # alias imports to expose them
    "PLR0913", # too many arguments to function / method
    "FIX002",  # line contains TODO
]
flake8-quotes = { inline-quotes = 'single', multiline-quotes = 'double' }
pydocstyle = { convention = 'google' }

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",    # asserts not allowed
    "ARG",     # unused function arguments
    "PLR2004", # magic value used
    "ANN001",  # missing type annotation for variable
    "ANN201",  # missing type annotation for function
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pyright]
strict = ["src/**"]

[tool.pytest.ini_options]
testpaths = ["tests/"]
markers = [
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test",
    "e2e: mark a test as an end-to-end test",
]
filterwarnings = [
    "ignore:^The @wait_container_is_ready decorator:DeprecationWarning",
]
